[project]
name = "mcp-code-mode-bench"
version = "0.1.0"
description = "Benchmark of code execution with MCP versus direct tool calling"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "openai>=3.42.1",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
